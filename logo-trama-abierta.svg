<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Trama abierta</title>
  <desc id="description">Hilos entrelazados en una forma circular abierta, con cinco nodos conectados y uno destacado.</desc>
  <defs>
    <linearGradient id="azul-tejido" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6E9F8"/>
      <stop offset="1" stop-color="#4FA7B8"/>
    </linearGradient>
    <linearGradient id="verde-tejido" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A8D8CC"/>
      <stop offset="1" stop-color="#2A8077"/>
    </linearGradient>
    <linearGradient id="oro-tejido" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CF79"/>
      <stop offset="1" stop-color="#B97922"/>
    </linearGradient>
    <filter id="relieve" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#001E32" flood-opacity=".42"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity=".22"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#relieve)">
    <!-- El contorno queda deliberadamente abierto: el recurso puede continuar y adaptarse. -->
    <path d="M104 326A188 188 0 0 1 170 89" stroke="#073B5C" stroke-width="34"/>
    <path d="M104 326A188 188 0 0 1 170 89" stroke="url(#azul-tejido)" stroke-width="22"/>
    <path d="M198 72A188 188 0 0 1 439 205" stroke="#073B5C" stroke-width="34"/>
    <path d="M198 72A188 188 0 0 1 439 205" stroke="url(#oro-tejido)" stroke-width="22"/>
    <path d="M447 240A188 188 0 0 1 306 438" stroke="#073B5C" stroke-width="34"/>
    <path d="M447 240A188 188 0 0 1 306 438" stroke="url(#verde-tejido)" stroke-width="22"/>
    <path d="M272 446A188 188 0 0 1 116 358" stroke="#073B5C" stroke-width="34"/>
    <path d="M272 446A188 188 0 0 1 116 358" stroke="url(#azul-tejido)" stroke-width="22"/>

    <!-- Cuatro recorridos se cruzan sin un centro jerárquico. -->
    <path d="M61 315C149 237 221 151 452 130" stroke="#073B5C" stroke-width="24"/>
    <path d="M61 315C149 237 221 151 452 130" stroke="url(#azul-tejido)" stroke-width="12"/>
    <path d="M116 66C164 166 218 305 430 416" stroke="#073B5C" stroke-width="24"/>
    <path d="M116 66C164 166 218 305 430 416" stroke="url(#verde-tejido)" stroke-width="12"/>
    <path d="M61 205C174 274 287 280 455 223" stroke="#073B5C" stroke-width="24"/>
    <path d="M61 205C174 274 287 280 455 223" stroke="url(#oro-tejido)" stroke-width="12"/>
    <path d="M151 446C220 337 284 169 392 65" stroke="#073B5C" stroke-width="24"/>
    <path d="M151 446C220 337 284 169 392 65" stroke="url(#azul-tejido)" stroke-width="12"/>
  </g>

  <!-- Cinco encuentros: nodos equivalentes; uno se distingue sin quedar aislado. -->
  <g stroke="#073B5C" stroke-width="9" filter="url(#relieve)">
    <circle cx="151" cy="238" r="17" fill="#D6E9F8"/>
    <circle cx="236" cy="208" r="17" fill="#A8D8CC"/>
    <circle cx="302" cy="259" r="17" fill="#F3EEE4"/>
    <circle cx="358" cy="337" r="17" fill="#A8D8CC"/>
    <circle cx="250" cy="135" r="17" fill="#D6E9F8"/>
    <circle cx="302" cy="259" r="8" fill="#C88928" stroke-width="0"/>
  </g>

  <!-- Los extremos visibles refuerzan que la trama no está clausurada. -->
  <g fill="#F3EEE4" stroke="#073B5C" stroke-width="7">
    <circle cx="61" cy="315" r="9"/>
    <circle cx="452" cy="130" r="9"/>
    <circle cx="116" cy="66" r="9"/>
    <circle cx="430" cy="416" r="9"/>
    <circle cx="61" cy="205" r="9"/>
    <circle cx="455" cy="223" r="9"/>
    <circle cx="151" cy="446" r="9"/>
    <circle cx="392" cy="65" r="9"/>
  </g>
</svg>
